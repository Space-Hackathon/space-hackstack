[project]
name = "space-hackstack-backend"
version = "0.1.0"
description = "FastAPI backend for the Space Hackstack monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pillow>=10.4",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
